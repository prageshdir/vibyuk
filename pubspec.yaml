name: vibyuk
description: VIBYUK — Create. Collaborate. Vibe. B2B Creator & Event Booking Platform.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'
  flutter: ">=3.16.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_bloc: ^8.1.3
  bloc: ^8.1.2

  # Routing
  go_router: ^13.2.0

  # Dependency Injection
  get_it: ^7.6.7
  injectable: ^2.3.2

  # Networking
  dio: ^5.4.0

  # Code Generation - Models
  freezed_annotation: ^2.4.1
  json_annotation: ^4.8.1

  # Secure Storage
  flutter_secure_storage: ^9.2.2

  # Local Database
  drift: ^2.15.0
  sqlite3_flutter_libs: ^0.5.20
  path: ^1.9.0
  path_provider: ^2.1.2

  # Key-Value Cache
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Firebase
  firebase_core: ^2.27.1
  firebase_messaging: ^14.8.5
  firebase_analytics: ^10.9.3
  firebase_crashlytics: ^3.4.15
  firebase_performance: ^0.9.3+15

  # Functional Programming
  dartz: ^0.10.1

  # Connectivity
  connectivity_plus: ^5.0.2

  # Logging
  logger: ^2.2.0
  talker_flutter: ^4.2.2
  talker_dio_logger: ^4.2.2
  talker_bloc_observer: ^4.2.2

  # Internationalization
  intl: ^0.19.0

  # Utilities
  equatable: ^2.0.5
  rxdart: ^0.27.7
  uuid: ^4.3.3
  encrypt: ^5.0.3

  # Images & Media
  cached_network_image: ^3.3.1
  flutter_svg: ^2.0.10+1

  # UI
  shimmer: ^3.0.0
  gap: ^3.0.1
  fl_chart: ^0.68.0

  # Biometric Authentication
  local_auth: ^2.3.0

  # Social Auth
  google_sign_in: ^6.2.1

  # Image Picker (avatar upload)
  image_picker: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.2
  build_runner: ^2.4.8
  freezed: ^2.4.7
  json_serializable: ^6.7.1
  injectable_generator: ^2.4.1
  drift_dev: ^2.15.0
  hive_generator: ^2.0.1
  mockito: ^5.4.4
  bloc_test: ^9.1.7

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
        - asset: assets/fonts/Inter-ExtraBold.ttf
          weight: 800
